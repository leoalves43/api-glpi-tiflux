name: tiflux-glpi-sync

services:
  sync:
    build: .
    image: tiflux-glpi-sync
    container_name: tiflux-glpi-sync
    restart: unless-stopped
    environment:
      # DB_HOST vem do .env (Postgres remoto). Não usar localhost lá: dentro do
      # container, localhost é o próprio container.
      TZ: America/Sao_Paulo
      INTERVALO_SEGUNDOS: "300"
    volumes:
      # Não usar env_file: o .env tem chaves com espaço antes do "=".
      - ./.env:/app/.env:ro
    # Maior que a pior execução: o loop espera a sincronização atual terminar.
    stop_grace_period: 10m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
